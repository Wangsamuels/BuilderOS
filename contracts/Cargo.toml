[workspace]
resolver = "2"
members = ["registry", "department", "company", "factory"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
near-sdk = { version = "5.7.0", features = ["unit-testing", "unstable"] }
near-contract-standards = "5.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
